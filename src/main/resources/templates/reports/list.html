<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Incident Reports</h2>
            <p class="text-secondary">
                Detailed findings and recommendations
            </p>
        </div>
        <a href="/reports/new" class="btn btn-danger">+ New Report</a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-dark table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Severity</th>
                    <th>Findings</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(reports)}">
                    <td colspan="5"
                        class="text-center text-secondary py-4">
                        No reports created yet.
                    </td>
                </tr>
                <tr th:each="report : ${reports}">
                    <td th:text="${report.id}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${report.severity == 'CRITICAL'} ? 'bg-danger' :
                                               (${report.severity == 'HIGH'} ? 'badge-open' :
                                               (${report.severity == 'MEDIUM'} ? 'badge-progress' : 'bg-secondary'))"
                              th:text="${report.severity}">
                        </span>
                    </td>
                    <td th:text="${#strings.abbreviate(report.findings, 60)}"></td>
                    <td th:text="${report.createdAt != null ? #temporals.format(report.createdAt, 'dd MMM yyyy') : '-'}"></td>
                    <td>
                        <a th:href="@{/reports/{id}/edit(id=${report.id})}"
                           class="btn btn-sm btn-outline-warning me-1">
                            Edit
                        </a>
                        <form th:action="@{/reports/{id}/delete(id=${report.id})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('Delete this report?')">
                            <button class="btn btn-sm btn-outline-danger">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
