<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container mt-4">

    <!-- LIST VIEW -->
    <div th:if="${view == 'list'}">
        <div th:replace="~{fragments/page-header :: header(
        title='Analysts',
        subtitle='Security analysts assigned to incidents',
        buttonText='+ New Analyst',
        buttonUrl='/analysts/new')}">
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Specialization</th>
                        <th>Incidents</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(analysts)}">
                        <td colspan="6"
                            class="text-center text-secondary py-4">
                            No analysts registered yet.
                        </td>
                    </tr>
                    <tr th:each="analyst : ${analysts}">
                        <td th:text="${analyst.id}"></td>
                        <td th:text="${analyst.name}"></td>
                        <td th:text="${analyst.email}"></td>
                        <td th:text="${analyst.specialization}"></td>
                        <td th:text="${analyst.incidents != null ? analyst.incidents.size() : 0}"></td>
                        <td>
                            <a th:href="@{/analysts/{id}/edit(id=${analyst.id})}"
                               class="btn btn-sm btn-outline-warning me-1">Edit</a>
                            <form th:action="@{/analysts/{id}/delete(id=${analyst.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('Delete this analyst?')">
                                <button class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FORM VIEW -->
    <div th:if="${view == 'form'}">
        <div th:replace="~{fragments/form-wrapper :: formTitle(
        title=${analyst.id == null ? 'New Analyst' : 'Edit Analyst'},
        subtitle='Analyst account details')}">
        </div>

        <div class="card p-4" style="max-width: 600px">
            <form th:action="${analyst.id == null ? '/analysts' : '/analysts/' + analyst.id}" method="post">
                <div class="mb-3">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="name" class="form-control" th:value="${analyst.name}" placeholder="e.g. Alice Chen" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" th:value="${analyst.email}" placeholder="e.g. alice@security.com">
                </div>
                <div class="mb-4">
                    <label class="form-label">Specialization</label>
                    <select name="specialization" class="form-select">
                        <option value="">Select specialization</option>
                        <option value="Network Security" th:selected="${analyst.specialization == 'Network Security'}">Network Security</option>
                        <option value="Malware Analysis" th:selected="${analyst.specialization == 'Malware Analysis'}">Malware Analysis</option>
                        <option value="Incident Response" th:selected="${analyst.specialization == 'Incident Response'}">Incident Response</option>
                        <option value="Threat Intelligence" th:selected="${analyst.specialization == 'Threat Intelligence'}">Threat Intelligence</option>
                        <option value="Forensics" th:selected="${analyst.specialization == 'Forensics'}">Forensics</option>
                    </select>
                </div>

                <div th:replace="~{fragments/form-buttons :: formButtons(cancelUrl='/analysts')}"></div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
