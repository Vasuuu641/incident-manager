<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container mt-4">

    <!-- LIST VIEW -->
    <div th:if="${view == 'list'}">
        <div th:replace="~{fragments/page-header :: header(
            title='SLA Policies',
            subtitle='Response time requirements by incident severity',
            buttonText='+ New Policy',
            buttonUrl='/sla-policies/new')}">
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-dark table-hover mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Severity</th>
                        <th>Resolution (hours)</th>
                        <th>Escalation (hours)</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(policies)}">
                        <td colspan="5"
                            class="text-center text-secondary py-4">
                            No SLA policies defined yet.
                        </td>
                    </tr>
                    <tr th:each="policy : ${policies}">
                        <td th:text="${policy.id}"></td>
                        <td>
                                <span class="badge"
                                      th:class="${policy.severity == 'CRITICAL' ? 'badge bg-danger' : (policy.severity == 'HIGH' ? 'badge badge-open' : (policy.severity == 'MEDIUM' ? 'badge badge-progress' : 'badge bg-secondary'))}"
                                      th:text="${policy.severity}">
                                </span>
                        </td>
                        <td th:text="${policy.resolutionHours} + ' hrs'"></td>
                        <td th:text="${policy.escalationHours} + ' hrs'"></td>
                        <td>
                            <a th:href="@{/sla-policies/{id}/edit(id=${policy.id})}"
                               class="btn btn-sm btn-outline-warning me-1">
                                Edit
                            </a>
                            <form th:action="@{/sla-policies/{id}/delete(id=${policy.id})}"
                                  method="post" style="display:inline"
                                  onsubmit="return confirm('Delete this policy?')">
                                <button class="btn btn-sm btn-outline-danger">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- FORM VIEW -->
    <div th:if="${view == 'form'}">
        <div th:replace="~{fragments/form-wrapper :: formTitle(
            title=${formTitle},
            subtitle='Define response time requirements for each severity level')}">
        </div>

        <div class="card p-4" style="max-width: 500px">
            <form th:action="${policy.id == null ? '/sla-policies' : '/sla-policies/' + policy.id}" method="post">
                <div class="mb-3">
                    <label class="form-label">Severity *</label>
                    <select name="severity" class="form-select" required>
                        <option value="">Select severity</option>
                        <option value="CRITICAL"
                                th:selected="${policy.severity == 'CRITICAL'}">Critical</option>
                        <option value="HIGH"
                                th:selected="${policy.severity == 'HIGH'}">High</option>
                        <option value="MEDIUM"
                                th:selected="${policy.severity == 'MEDIUM'}">Medium</option>
                        <option value="LOW"
                                th:selected="${policy.severity == 'LOW'}">Low</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Resolution Time (hours) *</label>
                    <input type="number" name="resolutionHours"
                           class="form-control"
                           th:value="${policy.resolutionHours}"
                           placeholder="e.g. 4 for CRITICAL"
                           min="1" required>
                    <small class="text-secondary">
                        Maximum hours to resolve before breach
                    </small>
                </div>
                <div class="mb-4">
                    <label class="form-label">Escalation Time (hours) *</label>
                    <input type="number" name="escalationHours"
                           class="form-control"
                           th:value="${policy.escalationHours}"
                           placeholder="e.g. 2 for CRITICAL"
                           min="1" required>
                    <small class="text-secondary">
                        Hours after detection before automatic escalation
                    </small>
                </div>

                <div th:replace="~{fragments/form-buttons :: formButtons(
                    cancelUrl='/sla-policies')}">
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
