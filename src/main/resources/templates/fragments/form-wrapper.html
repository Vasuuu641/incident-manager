<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:fragment="formTitle(title, subtitle)" class="mb-4">
    <h2 th:text="${title}"></h2>
    <p class="text-secondary" th:text="${subtitle}"></p>
</div>

<div th:fragment="formButtons(cancelUrl)" class="d-flex gap-2">
    <button type="submit" class="btn btn-danger">Save</button>
    <a th:href="${cancelUrl}"
       class="btn btn-outline-secondary">
        Cancel
    </a>
</div>

</body>
</html>
