<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incident Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .navbar { background-color: #161b22 !important;
            border-bottom: 1px solid #30363d; }
        .navbar-brand { color: #e94560 !important; font-weight: bold; }
        .nav-link { color: #8b949e !important; }
        .nav-link:hover { color: #c9d1d9 !important; }
        .card { background-color: #161b22;
            border: 1px solid #30363d; color: #c9d1d9; }
        .table { color: #c9d1d9; }
        .table-dark { background-color: #161b22; }
        .form-control { background-color: #0d1117;
            border-color: #30363d; color: #c9d1d9; }
        .form-control:focus { background-color: #0d1117;
            color: #c9d1d9; border-color: #e94560;
            box-shadow: none; }
        .form-select { background-color: #0d1117;
            border-color: #30363d; color: #c9d1d9; }
        .form-select:focus { background-color: #0d1117;
            color: #c9d1d9; border-color: #e94560;
            box-shadow: none; }
        .badge-open { background-color: #da3633; }
        .badge-progress { background-color: #d29922; }
        .badge-resolved { background-color: #238636; }
        .badge-closed { background-color: #6e7681; }
    </style>
</head>
</html>
