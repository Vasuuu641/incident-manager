<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:fragment="header(title, subtitle, buttonText, buttonUrl)"
     class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 th:text="${title}"></h2>
        <p class="text-secondary" th:text="${subtitle}"></p>
    </div>
    <a th:if="${buttonText != null}"
       th:href="@{${buttonUrl}}"
       class="btn btn-danger"
       th:text="${buttonText}">
    </a>
</div>
</body>
</html>
