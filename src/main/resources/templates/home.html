<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<div class="container mt-4">
    <div class="mb-4">
        <h2>Security Dashboard</h2>
        <p class="text-secondary">
            Real-time overview of active security incidents
        </p>
    </div>
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card text-center p-3">
                <div style="font-size:2.5rem;color:#da3633"
                     th:text="${openCount}">0</div>
                <div class="text-secondary mt-1">Open</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <div style="font-size:2.5rem;color:#d29922"
                     th:text="${inProgressCount}">0</div>
                <div class="text-secondary mt-1">In Progress</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <div style="font-size:2.5rem;color:#238636"
                     th:text="${resolvedCount}">0</div>
                <div class="text-secondary mt-1">Resolved</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center p-3">
                <div style="font-size:2.5rem;color:#1f6feb"
                     th:text="${openCount + inProgressCount + resolvedCount}">
                    0
                </div>
                <div class="text-secondary mt-1">Total</div>
            </div>
        </div>
    </div>
    <div class="d-flex gap-2">
        <a href="/incidents" class="btn btn-primary">
            View All Incidents
        </a>
        <a href="/incidents/new" class="btn btn-danger">
            + Report New Incident
        </a>
    </div>
</div>
</body>
</html>
