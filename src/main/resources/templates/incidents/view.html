<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 th:text="${incident.title}"></h2>
            <span th:text="${incident.status}"
                  th:class="${incident.status == 'OPEN'} ? 'badge badge-open' :
                (${incident.status == 'IN_PROGRESS'} ? 'badge badge-progress' :
                (${incident.status == 'RESOLVED'} ? 'badge badge-resolved' :
                (${incident.status == 'ESCALATED'} ? 'badge bg-danger' :
                'badge badge-closed')))">
            </span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/incidents/{id}/edit(id=${incident.id})}"
               class="btn btn-outline-warning">Edit</a>
            <a href="/incidents" class="btn btn-outline-secondary">
                Back
            </a>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-md-8">
            <div class="card p-4 mb-4">
                <h5 class="mb-3">Incident Details</h5>
                <p class="text-secondary"
                   th:text="${incident.description} ?: 'No description provided'">
                </p>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <small class="text-secondary">Detected</small>
                        <p th:text="${incident.detectedAt != null ? #temporals.format(incident.detectedAt, 'dd MMM yyyy HH:mm') : 'Unknown'}">
                        </p>
                    </div>
                    <div class="col-md-6">
                        <small class="text-secondary">Assigned Analyst</small>
                        <p th:text="${incident.analyst != null ? incident.analyst.name : 'Unassigned'}">
                        </p>
                    </div>
                </div>
                <div class="col-md-6">
                    <small class="text-secondary">SLA Policy</small>
                    <p th:text="${incident.slaPolicy != null} ?
                       ${incident.slaPolicy.severity} + ' — ' +
                       ${incident.slaPolicy.resolutionHours} + ' hrs' :
                       'No policy assigned'">
                    </p>
                </div>
                <div class="col-md-6">
                    <small class="text-secondary">SLA Deadline</small>
                    <p th:if="${incident.slaDeadline != null}">
                        <span th:text="${#temporals.format(incident.slaDeadline,
                        'dd MMM yyyy HH:mm')}"></span>
                        <span th:if="${incident.escalated}"
                              class="badge bg-danger ms-1">
                                Breached
                        </span>
                        <span th:if="${!incident.escalated}"
                              class="badge bg-success ms-1">
                                 Within SLA
                         </span>
                    </p>
                    <p th:if="${incident.slaDeadline == null}"
                       class="text-secondary">Not set</p>
                </div>
                <div th:if="${incident.tags != null and !incident.tags.isEmpty()}">
                    <small class="text-secondary">Tags</small>
                    <div class="mt-1">
                        <span th:each="tag : ${incident.tags}"
                              class="badge bg-secondary me-1"
                              th:text="${tag.name}">
                        </span>
                    </div>
                </div>
            </div>
            <div class="card p-4 mb-4"
                 th:if="${incident.report != null}">

                <h5 class="mb-3">Incident Report</h5>
                <div class="mb-3">
                    <small class="text-secondary">Severity</small>
                    <p>
                        <span class="badge"
                              th:classappend="${incident.report.severity == 'CRITICAL'} ? 'bg-danger' :
                                           (${incident.report.severity == 'HIGH'} ? 'badge-open' :
                                           (${incident.report.severity == 'MEDIUM'} ? 'badge-progress' : 'bg-secondary'))"
                              th:text="${incident.report.severity}">
                        </span>
                    </p>
                </div>
                <div class="mb-3">
                    <small class="text-secondary">Findings</small>
                    <p th:text="${incident.report.findings}"></p>
                </div>
                <div>
                    <small class="text-secondary">Recommendations</small>
                    <p th:text="${incident.report.recommendations}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Affected Assets</h5>
                    <a th:href="@{/assets/new(incidentId=${incident.id})}"
                       class="btn btn-sm btn-outline-danger">+ Add</a>
                </div>
                <div th:if="${incident.assets == null or incident.assets.isEmpty()}"
                     class="text-secondary">
                    No assets linked to this incident.
                </div>
                <div th:each="asset : ${incident.assets}"
                     class="mb-2 p-2"
                     style="border: 1px solid #30363d; border-radius: 6px;">
                    <div class="d-flex justify-content-between">
                        <div>
                            <div th:text="${asset.hostname}"></div>
                            <small class="text-secondary"
                                   th:text="${asset.ipAddress}"></small>
                            <br>
                            <small class="badge bg-secondary"
                                   th:text="${asset.assetType}"></small>
                        </div>
                        <form th:action="@{/assets/{id}/delete(id=${asset.id})}"
                              method="post">
                            <input type="hidden" name="incidentId"
                                   th:value="${incident.id}">
                            <button class="btn btn-sm btn-outline-danger">×</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
