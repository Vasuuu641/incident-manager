<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="mb-4">
        <h2>Add Report</h2>
        <p class="text-secondary"
           th:text="'Creating report for: ' + ${incident.title}">
        </p>
    </div>
    <div class="card p-4">
        <form th:action="@{/incidents/{id}/report(id=${incident.id})}"
              method="post">
            <div class="mb-3">
                <label class="form-label">Severity *</label>
                <select name="severity" class="form-select" required>
                    <option value="">Select severity</option>
                    <option value="LOW">Low</option>
                    <option value="MEDIUM">Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Findings *</label>
                <textarea name="findings"
                          class="form-control" rows="4"
                          placeholder="What was discovered?"
                          required>
                </textarea>
            </div>
            <div class="mb-4">
                <label class="form-label">Recommendations</label>
                <textarea name="recommendations"
                          class="form-control" rows="4"
                          placeholder="What actions should be taken?">
                </textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    Save Report
                </button>
                <a th:href="@{/incidents/{id}(id=${incident.id})}"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
