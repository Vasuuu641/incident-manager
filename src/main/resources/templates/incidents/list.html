<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Incidents</h2>
            <p class="text-secondary">All registered security incidents</p>
        </div>
        <a href="/incidents/new" class="btn btn-danger">
            + New Incident
        </a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-dark table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Analyst</th>
                    <th>Detected</th>
                    <th>Tags</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(incidents)}">
                    <td colspan="7" class="text-center text-secondary py-4">
                        No incidents recorded yet.
                    </td>
                </tr>
                <tr th:each="incident : ${incidents}">
                    <td th:text="${incident.id}"></td>
                    <td th:text="${incident.title}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${incident.status == 'OPEN'} ? 'badge-open' :
                                               (${incident.status == 'IN_PROGRESS'} ? 'badge-progress' :
                                               (${incident.status == 'RESOLVED'} ? 'badge-resolved' : 'badge-closed'))"
                              th:text="${incident.status}">
                        </span>
                    </td>
                    <td th:text="${incident.analyst != null ? incident.analyst.name : 'Unassigned'}"></td>
                    <td th:text="${incident.detectedAt != null ? #temporals.format(incident.detectedAt, 'dd MMM yyyy HH:mm') : '-'}"></td>
                    <td>
                        <span th:if="${incident.tags != null}"
                              th:each="tag : ${incident.tags}"
                              class="badge bg-secondary me-1"
                              th:text="${tag.name}">
                        </span>
                    </td>
                    <td>
                        <a th:href="@{/incidents/{id}(id=${incident.id})}"
                           class="btn btn-sm btn-outline-info me-1">View</a>
                        <a th:href="@{/incidents/{id}/edit(id=${incident.id})}"
                           class="btn btn-sm btn-outline-warning me-1">Edit</a>
                        <form th:action="@{/incidents/{id}/delete(id=${incident.id})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('Delete this incident?')">
                            <button class="btn btn-sm btn-outline-danger">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
