<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="mb-4">
        <h2 th:text="${policy.id == null} ?
            'New SLA Policy' : 'Edit SLA Policy'"></h2>
        <p class="text-secondary">
            Define response time requirements for each severity level
        </p>
    </div>
    <div class="card p-4" style="max-width: 500px">
        <form th:action="${policy.id == null} ? @{/sla-policies} :
              @{/sla-policies/{id}(id=${policy.id})}" method="post">
            <div class="mb-3">
                <label class="form-label">Severity *</label>
                <select name="severity" class="form-select" required>
                    <option value="">Select severity</option>
                    <option value="CRITICAL"
                            th:selected="${policy.severity == 'CRITICAL'}">
                        Critical
                    </option>
                    <option value="HIGH"
                            th:selected="${policy.severity == 'HIGH'}">
                        High
                    </option>
                    <option value="MEDIUM"
                            th:selected="${policy.severity == 'MEDIUM'}">
                        Medium
                    </option>
                    <option value="LOW"
                            th:selected="${policy.severity == 'LOW'}">
                        Low
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">
                    Resolution Time (hours) *
                </label>
                <input type="number" name="resolutionHours"
                       class="form-control"
                       th:value="${policy.resolutionHours}"
                       placeholder="e.g. 4 for CRITICAL"
                       min="1" required>
                <small class="text-secondary">
                    Maximum hours to resolve before breach
                </small>
            </div>
            <div class="mb-4">
                <label class="form-label">
                    Escalation Time (hours) *
                </label>
                <input type="number" name="escalationHours"
                       class="form-control"
                       th:value="${policy.escalationHours}"
                       placeholder="e.g. 2 for CRITICAL"
                       min="1" required>
                <small class="text-secondary">
                    Hours after detection before automatic escalation
                </small>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    Save Policy
                </button>
                <a href="/sla-policies"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
