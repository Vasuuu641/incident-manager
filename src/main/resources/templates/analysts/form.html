<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="mb-4">
        <h2 th:text="${analyst.id == null} ? 'New Analyst' : 'Edit Analyst'"></h2>
        <p class="text-secondary">Analyst account details</p>
    </div>
    <div class="card p-4" style="max-width: 600px">
        <form th:action="${analyst.id == null} ? @{/analysts} :
              @{/analysts/{id}(id=${analyst.id})}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" name="name"
                       class="form-control"
                       th:value="${analyst.name}"
                       placeholder="e.g. Alice Chen" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email"
                       class="form-control"
                       th:value="${analyst.email}"
                       placeholder="e.g. alice@security.com">
            </div>
            <div class="mb-4">
                <label class="form-label">Specialization</label>
                <select name="specialization" class="form-select">
                    <option value="">Select specialization</option>
                    <option value="Network Security"
                            th:selected="${analyst.specialization == 'Network Security'}">
                        Network Security
                    </option>
                    <option value="Malware Analysis"
                            th:selected="${analyst.specialization == 'Malware Analysis'}">
                        Malware Analysis
                    </option>
                    <option value="Incident Response"
                            th:selected="${analyst.specialization == 'Incident Response'}">
                        Incident Response
                    </option>
                    <option value="Threat Intelligence"
                            th:selected="${analyst.specialization == 'Threat Intelligence'}">
                        Threat Intelligence
                    </option>
                    <option value="Forensics"
                            th:selected="${analyst.specialization == 'Forensics'}">
                        Forensics
                    </option>
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    Save Analyst
                </button>
                <a href="/analysts"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
