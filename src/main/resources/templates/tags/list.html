<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Tags</h2>
            <p class="text-secondary">
                Attack type categories for incidents
            </p>
        </div>
        <a href="/tags/new" class="btn btn-danger">+ New Tag</a>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-dark table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Color</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tags)}">
                    <td colspan="4"
                        class="text-center text-secondary py-4">
                        No tags created yet.
                    </td>
                </tr>
                <tr th:each="tag : ${tags}">
                    <td th:text="${tag.id}"></td>
                    <td>
                            <span class="badge"
                                  th:style="'background-color:' + ${tag.color}"
                                  th:text="${tag.name}">
                            </span>
                    </td>
                    <td th:text="${tag.color}"></td>
                    <td>
                        <a th:href="@{/tags/{id}/edit(id=${tag.id})}"
                           class="btn btn-sm btn-outline-warning me-1">
                            Edit
                        </a>
                        <form th:action="@{/tags/{id}/delete(id=${tag.id})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('Delete this tag?')">
                            <button class="btn btn-sm btn-outline-danger">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
