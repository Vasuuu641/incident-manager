<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container mt-4">
    <div class="mb-4">
        <h2 th:text="${tag.id == null} ? 'New Tag' : 'Edit Tag'"></h2>
        <p class="text-secondary">
            Create a category label for incident classification
        </p>
    </div>
    <div class="card p-4" style="max-width: 500px">
        <form th:action="${tag.id == null} ? @{/tags} :
              @{/tags/{id}(id=${tag.id})}" method="post">
            <div class="mb-3">
                <label class="form-label">Tag Name *</label>
                <input type="text" name="name"
                       class="form-control"
                       th:value="${tag.name}"
                       placeholder="e.g. Ransomware, DDoS, Phishing"
                       required>
            </div>
            <div class="mb-4">
                <label class="form-label">Color</label>
                <div class="d-flex gap-2 align-items-center">
                    <input type="color" name="color"
                           class="form-control form-control-color"
                           th:value="${tag.color} ?: '#6e7681'"
                           style="width: 60px; height: 38px">
                    <small class="text-secondary">
                        Choose a color for this tag badge
                    </small>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    Save Tag
                </button>
                <a href="/tags"
                   class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
