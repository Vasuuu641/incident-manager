<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login — Incident Manager</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #1a1a2e; }
        .card { background-color: #16213e; border: 1px solid #0f3460; }
        .card-title { color: #e94560; }
        .form-label { color: #a8b2d8; }
        .form-control { background-color: #0f3460; border-color: #533483;
            color: white; }
        .form-control:focus { background-color: #0f3460; color: white;
            border-color: #e94560; box-shadow: none; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 100vh">
    <div class="card p-4" style="width: 420px">
        <div class="card-body">
            <h4 class="card-title text-center mb-4">
                🛡️ Incident Manager
            </h4>
            <p class="text-center text-secondary mb-4">
                Security Incident Management System
            </p>
            <div th:if="${param.error}"
                 class="alert alert-danger">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}"
                 class="alert alert-success">
                You have been logged out.
            </div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username"
                           class="form-control"
                           placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password"
                           class="form-control"
                           placeholder="Enter password" required>
                </div>
                <button type="submit"
                        class="btn btn-danger w-100 mt-2">
                    Login
                </button>
            </form>
            <div class="mt-3 text-center">
                <small class="text-secondary">
                    analyst / password &nbsp;·&nbsp; admin / admin
                </small>
            </div>
        </div>
    </div>
</div>
</body>
</html>
